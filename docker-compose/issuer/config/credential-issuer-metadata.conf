credentialConfigurations = {
  # W3C Verifiable Credential as a plain JWT. This is the configuration the dsp-rs
  # connector redeems and verifies: its verifier reads `vc.credentialSubject` from a
  # signed JWT. The SD-JWT configuration below is left in place but is not readable
  # by that verifier — see docs/limitations.md.
  "IdentityCredential_jwt_vc_json" = {
    format = "jwt_vc_json"
    scope = "identity_credential"
    credential_signing_alg_values_supported = ["ES256"]
    cryptographic_binding_methods_supported = ["did:web", "did:key", "jwk"]
    credential_definition = {
      types = ["VerifiableCredential", "IdentityCredential"]
    }
    proof_types_supported = {
      jwt = {
        proof_signing_alg_values_supported = ["ES256"]
      }
    }
  }

  "identity_credential" = {
    format = "dc+sd-jwt"
    scope = "identity_credential"
    # Use exactly "vctBaseUrl" to publish <configured service base URL>/openid4vci/<credential configuration id> as the VCT.
    # Wallets resolve that VCT through /.well-known/vct/<credential configuration id>; any other string is published unchanged.
    vct = "vctBaseUrl"
    credential_signing_alg_values_supported = ["ES256"]
    cryptographic_binding_methods_supported = ["jwk", "did:key", "did:web", "did:jwk", "did:ebsi"]
    proof_types_supported = {
      jwt = {
        proof_signing_alg_values_supported = ["ES256", "EdDSA"]
      }
    }
  }
}
