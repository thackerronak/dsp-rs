# Default credential signing material for OSS Issuer2 profiles.
defaultIssuerKey = {
  type = "jwk"
  jwk = {
    kty = "EC"
    d = "KJ4k3Vcl5Sj9Mfq4rrNXBm2MoPoY3_Ak_PIR_EgsFhQ"
    crv = "P-256"
    x = "G0RINBiF-oQUD3d5DGnegQuXenI29JDaMGoMvioKRBM"
    y = "ed3eFGs2pEtrp7vAZ7BLcbrUtpKkYWAT2JPUQK4lN4E"
  }
}

defaultIssuerDid = "did:web:issuer-did-server"

# Profiles are deployment templates for every credential configuration advertised in
# credential-issuer-metadata.conf.
profiles = {
  # Issues the W3C JWT-VC the connector can verify. `email` and `address.country`
  # are the two claims the connector maps onto its access token
  # (Authenticator::derive_access_token), so both must be present.
  identityCredentialJwtVc = {
    name = "Identity Credential (W3C JWT-VC)"
    credentialConfigurationId = "IdentityCredential_jwt_vc_json"
    issuerKey = ${defaultIssuerKey}
    issuerDid = ${defaultIssuerDid}
    credentialData = {
      "@context" = ["https://www.w3.org/2018/credentials/v1"]
      # One canonical credential type across the demo. A verifier matches a presentation
      # against the type in the VC itself, so this has to be the same string the DCP scope
      # uses (org.eclipse.dspace.dcp.vc.type:identity_credential).
      "type" = ["VerifiableCredential", "identity_credential"]
      "credentialSubject" = {
        "given_name" = "John"
        "family_name" = "Doe"
        "email" = "johndoe@example.com"
        "address" = {
          "street_address" = "123 Main St"
          "locality" = "Anytown"
          "region" = "Anystate"
          "country" = "DE"
        }
      }
    }
    # `issuanceDate` / `expirationDate` are what make walt.id emit the registered JWT
    # claims `nbf` and `exp` at the top level of the token, the way VC-JWT requires and
    # the connector's verifier checks. With only the `iat`/`nbf`/`exp` keys below, those
    # values land inside the `vc` object and the token has no top-level `exp` at all.
    mapping = {
      id = "<uuid>"
      issuanceDate = "<timestamp>"
      expirationDate = "<timestamp-in:365d>"
    }
  }

  identityCredentialSdJwt = {
    name = "Identity Credential"
    credentialConfigurationId = "identity_credential"
    issuerKey = ${defaultIssuerKey}
    issuerDid = ${defaultIssuerDid}
    credentialData = {
      "given_name" = "John"
      "family_name" = "Doe"
      "email" = "johndoe@example.com"
      "phone_number" = "+1-202-555-0101"
      "address" = {
        "street_address" = "123 Main St"
        "locality" = "Anytown"
        "region" = "Anystate"
        "country" = "US"
      }
      "birthdate" = "1940-01-01"
      "is_over_18" = true
      "is_over_21" = true
      "is_over_65" = true
    }
    mapping = {
      id = "<uuid>"
      iat = "<timestamp-seconds>"
      nbf = "<timestamp-seconds>"
      exp = "<timestamp-in-seconds:365d>"
    }
    selectiveDisclosure = {
      "fields" = {
        "birthdate" = {
          "sd" = true
        }
        "family_name" = {
          "sd" = false
        }
      }
      "decoyMode" = "NONE"
      "decoys" = 0
    }
    idTokenClaimsMapping = {
      "$.given_name" = "$.given_name"
      "$.family_name" = "$.family_name"
    }
  }
}
