services:
  # ==========================================
  # PARTY A CONNECTOR (NATIVE DCP)
  # ==========================================
  party-a-connector:
    image: ${CONNECTOR_IMAGE}
    container_name: party-a-connector
    volumes:
      - ./party-a/connector/config.json:/app/config.json:ro
      - ./party-a/connector/data:/app/data
    networks:
      - dcp-network
    ports:
      - "13000:3000"

  # ==========================================
  # PARTY B CONNECTOR (NATIVE DCP)
  # ==========================================
  party-b-connector:
    image: ${CONNECTOR_IMAGE}
    container_name: party-b-connector
    volumes:
      - ./party-b/connector/config.json:/app/config.json:ro
      - ./party-b/connector/data:/app/data
    networks:
      - dcp-network
    ports:
      - "23000:3000"

networks:
  dcp-network:
    name: dcp-network
    driver: bridge
