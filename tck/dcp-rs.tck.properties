# Sample configuration for running the DCP TCK (https://github.com/eclipse-dataspacetck/dcp-tck)
# against this connector, the same way tck/dsp-rs.tck.properties runs the DSP TCK against it.
#
# This connector plays every DCP role — holder/CredentialService, IssuerService, and verifier —
# behind one did:web (see AGENTS.md, "Authentication is a native wallet"). That is unlike a
# deployment where those are separate services, so dataspacetck.did.holder/.issuer/.verifier
# below all resolve to the same DID: this connector's own.
#
# Start the connector first (README.md, "Run connector against DCP TCK"), then point the TCK
# at this file. Values marked CHANGE_ME cannot be predicted ahead of a run — the TCK mints its
# own DIDs for the mock services it stands up on dataspacetck.callback.address, and those only
# appear in its startup log.
#
# Run the connector WITHOUT --features tck for this. That feature stubs out AuthClaims
# (src/auth/extractor.rs) for the DSP-only catalog/negotiation/transfer endpoints, which the
# DCP TCK never calls — but it also zeroes Authenticator::get_token (src/auth/mod.rs), and
# there is no upside to carrying that stub into a run whose whole point is exercising the
# real DCP auth path. The wallet's own routes (CredentialService, IssuerService, /auth/token)
# are never stubbed by that feature either way.

# Loopback address of the TCK's own embedded services (the mock issuer/holder/verifier it
# plays opposite this connector, depending on which test package is running). The connector
# must be able to reach this address to resolve the TCK's DID, pull VPs from it, and deliver
# credentials to it.
dataspacetck.callback.address=http://localhost:8080

# This connector's DID in every role (see note above). Matches did:web:localhost%3A3000,
# derived from tck/config.json's external_address by derive_did_web (src/shared/did.rs).
dataspacetck.did.holder=did:web:localhost%3A3000
dataspacetck.did.issuer=did:web:localhost%3A3000
dataspacetck.did.verifier=did:web:localhost%3A3000

# The TCK's own synthetic "unauthorized third party" identity, used in negative verifier
# test cases. Printed by the TCK at startup — copy it in from there.
dataspacetck.did.thirdparty=CHANGE_ME

# This connector's DCP-over-DSP verifier (Authenticator::authenticate /
# Authenticator::verify_peer_credentials, src/auth/mod.rs): validates the presented
# Self-Issued ID Token, pulls a Verifiable Presentation from the peer's CredentialService,
# validates the VP and the VC inside it, and returns 200 with a DSP access token on success
# or 401 otherwise — the 2xx/4xx contract the TCK's Verifier package expects from a trigger
# endpoint.
dataspacetck.vpp.trigger.endpoint=http://localhost:3000/auth/token

# Matches SCOPE_TYPE_PREFIX in src/wallet/dcp/scope.rs, and tolerates the optional trailing
# operation (":read" / ":*" / ":all") that ScopeQuery::parse strips (added for party C —
# see docs/limitations.md, "The scope grammar carries an operation").
dataspacetck.vc.scope.pattern=org\\.eclipse\\.dspace\\.dcp\\.vc\\.type:(?<type>[^:]+)(:.*)?
dataspacetck.vc.scope.membershipcredential=org.eclipse.dspace.dcp.vc.type:MembershipCredential
dataspacetck.vc.scope.sensitivedatacredential=org.eclipse.dspace.dcp.vc.type:SensitiveDataCredential
dataspacetck.vc.scope.someothercredential=org.eclipse.dspace.dcp.vc.type:SomeOtherCredential

# Left unset: this connector's Self-Issued ID Tokens are always minted locally
# (src/wallet/dcp/si_token.rs, build_si_token) — it never calls out to an external Secure
# Token Service, so there is nothing for these to configure.
#dataspacetck.sts.url=
#dataspacetck.sts.client.id=
#dataspacetck.sts.client.secret=

# Known to fail: this connector issues no revocation status list (bitstringstatuslist or
# revocationlist2020) for the credentials it mints — see docs/limitations.md. Every
# revocation test case will fail regardless of which type is configured here; that is a real
# gap, not a config problem.
dataspacetck.revocation.type=bitstringstatuslist
