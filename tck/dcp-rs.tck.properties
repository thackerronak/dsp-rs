# Configuration for running the DCP TCK (https://github.com/eclipse-dataspacetck/dcp-tck)
# against this connector, the same way tck/dsp-rs.tck.properties runs the DSP TCK against it.
#
# Run status (Gradle build of dcp-tck, `java -jar dcp-tck-runtime.jar -config
# tck/dcp-rs.tck.properties` against the plain, non-tck-feature connector): 85/117 pass. That
# run found and fixed six real bugs — a malformed IssuerMetadata/CredentialObject response
# shape, a too-strict CredentialContainer parse that rejected the TCK's own seed messages, a
# completely unauthenticated credential-status endpoint, an SI token validator that never
# checked `nbf`/`iat` and let `exp` slide 60s past due to jsonwebtoken's default leeway, and a
# wrong `allowed_issuers` in tck/config.json that was quietly hiding the next one — see
# src/wallet/dcp/{model,si_token,issuer}.rs and git log for the fixes. The remaining 32
# failures are catalogued in docs/limitations.md under "DCP TCK conformance": a real,
# security-relevant gap in verifying a presented credential's content (expiry, revocation,
# subject binding, requested-vs-presented type), an already-known gap (no per-`kid` key
# selection), a structural limit of testing one connector that plays every DCP role against a
# harness that models holder/issuer/verifier as separate parties with independent keys, and
# real unimplemented CS/IssuerService business rules (pending-request tracking,
# double-issuance prevention).
#
# This connector plays every DCP role — holder/CredentialService, IssuerService, and verifier —
# behind one did:web (see AGENTS.md, "Authentication is a native wallet"). That is unlike a
# deployment where those are separate services, so dataspacetck.did.holder/.issuer/.verifier
# below all resolve to the same DID: this connector's own.
#
# Start the connector first (README.md, "Run connector against DCP TCK"), then point the TCK
# at this file. dataspacetck.did.thirdparty is deliberately left unset — see below.
#
# Run the connector WITHOUT --features tck for this. That feature stubs out AuthClaims
# (src/auth/extractor.rs) for the DSP-only catalog/negotiation/transfer endpoints, which the
# DCP TCK never calls — but it also zeroes Authenticator::get_token (src/auth/mod.rs), and
# there is no upside to carrying that stub into a run whose whole point is exercising the
# real DCP auth path. The wallet's own routes (CredentialService, IssuerService, /auth/token)
# are never stubbed by that feature either way.

# Loopback address of the TCK's own embedded services (its mock DID/HTTP servers, and where
# it looks for a verifier trigger by default). The connector must be able to reach this
# address to resolve any of the TCK's self-generated DIDs (see dataspacetck.did.thirdparty
# below) and pull VPs from them.
dataspacetck.callback.address=http://localhost:8080

# Confirmed against the TCK's own source (BaseAssembly.java): dataspacetck.did.holder/
# .issuer/.verifier are NOT "this connector's DID" by convention — they are the DID the TCK
# itself signs AS when it plays that role, matched against dataspacetck.key.<role> (an EC
# JWK; unset means the TCK generates its own random key and self-hosts a matching did:web
# document at dataspacetck.callback.address instead).
#
# This connector plays every DCP role behind one did:web (AGENTS.md, "Authentication is a
# native wallet"), so to have the TCK exercise its REAL endpoints — not a same-shaped but
# unrelated mock — both the DID and the matching private key below are set to this
# connector's own: did:web:localhost%3A3000 (derive_did_web of tck/config.json's
# external_address, src/shared/did.rs) and the JWK for tck/config.json's
# wallet.private_key_pem (the credential_key_pair every DCP role shares). Leaving the DID set
# but the key unset — my first attempt — makes the TCK sign with a random key while
# addressing this connector's real, different key: every request then fails signature
# verification with 401, which is exactly what the first live run below surfaced.
#
# There is no dataspacetck.key.verifier override (BaseAssembly always generates a random
# one), and that is a real, unresolved conflict, not a settled tradeoff: the
# presentation.verifier package needs dataspacetck.did.verifier set to this connector's DID
# so the `aud` on a token this connector receives matches (that works, and is why it is set
# below); the presentation.cs package needs the opposite — the TCK signs its own queries to
# this connector's CredentialService AS the verifier, and without a matching key that
# signature can never validate, so several presentation.cs tests fail no matter which way
# this is set. See docs/limitations.md, "DCP TCK conformance" for the concrete list.
dataspacetck.did.holder=did:web:localhost%3A3000
dataspacetck.did.issuer=did:web:localhost%3A3000
dataspacetck.did.verifier=did:web:localhost%3A3000
dataspacetck.key.holder={"kty":"EC","crv":"P-256","x":"XIV-YyW1R1G38XTmIuBIG5ac2KSJmNR5TfwfRla3uBw","y":"6EOfVNielaxf8noBTkjm_pXEVerMtT0Zbrs8b6TGQek","d":"OLhFoYt4aTJPYhB1xXg3gfG89YtndEF8nsUw6qc8sLc"}
dataspacetck.key.issuer={"kty":"EC","crv":"P-256","x":"XIV-YyW1R1G38XTmIuBIG5ac2KSJmNR5TfwfRla3uBw","y":"6EOfVNielaxf8noBTkjm_pXEVerMtT0Zbrs8b6TGQek","d":"OLhFoYt4aTJPYhB1xXg3gfG89YtndEF8nsUw6qc8sLc"}

# This JWK is only ever the wallet.private_key_pem already committed in tck/config.json,
# re-encoded — a fixture key for local TCK runs, matching that file's existing convention of
# committing test-only key material. Never reuse it, or this pattern, outside a throwaway
# TCK/demo config.

# Left unset on purpose: the TCK's "unauthorized third party" identity must NOT be this
# connector's own DID, and since there is no dataspacetck.key.thirdparty override, an unset
# dataspacetck.did.thirdparty gets a self-generated DID with a matching self-generated key —
# genuinely foreign, which is the point of the negative test cases that use it.
#dataspacetck.did.thirdparty=

# This connector's DCP-over-DSP verifier (Authenticator::authenticate /
# Authenticator::verify_peer_credentials, src/auth/mod.rs): validates the presented
# Self-Issued ID Token, pulls a Verifiable Presentation from the peer's CredentialService,
# validates the VP and the VC inside it, and returns 200 with a DSP access token on success
# or 401 otherwise — the 2xx/4xx contract the TCK's Verifier package expects from a trigger
# endpoint.
dataspacetck.vpp.trigger.endpoint=http://localhost:3000/auth/token

# Matches SCOPE_TYPE_PREFIX in src/wallet/dcp/scope.rs, and tolerates the optional trailing
# operation (":read" / ":*" / ":all") that ScopeQuery::parse strips (added for party C —
# see docs/limitations.md, "The scope grammar carries an operation").
dataspacetck.vc.scope.pattern=org\\.eclipse\\.dspace\\.dcp\\.vc\\.type:(?<type>[^:]+)(:.*)?
dataspacetck.vc.scope.membershipcredential=org.eclipse.dspace.dcp.vc.type:MembershipCredential
dataspacetck.vc.scope.sensitivedatacredential=org.eclipse.dspace.dcp.vc.type:SensitiveDataCredential
dataspacetck.vc.scope.someothercredential=org.eclipse.dspace.dcp.vc.type:SomeOtherCredential

# Left unset: `@AuthToken`-based tests get theirs from the TCK's own in-process test STS
# (SecureTokenServerImpl — "a local test STS" per its own source), not an external one, so
# there is nothing here to point at it. Separately, this connector's own Self-Issued ID
# Tokens are always minted locally (src/wallet/dcp/si_token.rs, build_si_token) and never
# call out to an STS either.
#dataspacetck.sts.url=
#dataspacetck.sts.client.id=
#dataspacetck.sts.client.secret=

# Known to fail: this connector issues no revocation status list (bitstringstatuslist or
# revocationlist2020) for the credentials it mints — see docs/limitations.md. Every
# revocation test case will fail regardless of which type is configured here; that is a real
# gap, not a config problem.
dataspacetck.revocation.type=bitstringstatuslist
